<!--
  Universal Integral Ed Chat Widget (Chatbase)

  This widget provides customer support and inquiry handling across all
  Integral Ed microsites using a shared Chatbase instance.

  Features:
  - Loads after 10-second delay to avoid impacting page load performance
  - Appears bottom-right (Chatbase default position)
  - Shared Chatbase ID across all sites for unified conversations
  - No per-site configuration needed

  Usage:
  Microsites should inject this file into the <body> of HTML pages at build time.
  The widget is identical across all sites.

  Technical details:
  - Chatbase ID: Yb5-ZOPsnSt9Ju6r3P7C7
  - Domain: www.chatbase.co
  - Load delay: 10 seconds (10000ms)
  - Position: Bottom-right (default)
-->

<script>
setTimeout(function () {
  (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="Yb5-ZOPsnSt9Ju6r3P7C7";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
}, 10000);
</script>
